<article class="post-content">
  <a class="text-link post-back" href="{{ '/blog/' | relative_url }}">← All writing</a>
  <header>
    <p class="eyebrow">FIELD NOTE</p>
    <h1>{{ page.title | escape }}</h1>
    <p class="post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time></p>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
</article>
