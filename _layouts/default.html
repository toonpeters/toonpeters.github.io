<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} — {% endif %}{{ site.title | escape }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title | escape }}<span class="wordmark-dot">.</span></a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}#work">Projects</a>
          <a href="{{ '/blog/' | relative_url }}">Writing</a>
        </nav>
      </header>

      <main id="main-content">
        {{ content }}
      </main>

      <footer class="site-footer">
        <span>© Toon Peters</span>
        <a href="#main-content">Back to top ↑</a>
      </footer>
    </div>
  </body>
</html>
